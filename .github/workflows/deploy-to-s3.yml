name: Advanced Deploy to S3

concurrency:
  group: deploy-to-s3
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      BUCKET_NAME: bankmore-deploy-bucket-alex
      MAX_BUILDS: 5  # Quantos builds manter no S3

    steps:
    # 1️⃣ Checkout do repositório
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Configurar AWS CLI
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

    # 3️⃣ Build da aplicação .NET
    - name: Build application
      run: |
        echo "Construindo aplicação .NET..."
        dotnet restore BankMore.Auth.sln
        dotnet build -c Release BankMore.Auth.sln
        dotnet publish -c Release -o ./build

    # 4️⃣ Verificar se a pasta build existe
    - name: Check build folder
      run: |
        if [ -d "./build" ]; then
          echo "Pasta build existe!"
        else
          echo "ERRO: Pasta build não existe!"
          exit 1
        fi

    #
