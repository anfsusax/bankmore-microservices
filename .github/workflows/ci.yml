name: CI - Build, Test and Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1️⃣ Checa o código do repositório
      # =========================================================
      - name: Checkout do código
        uses: actions/checkout@v4

      # =========================================================
      # 2️⃣ Configura o .NET 8 (mesma versão usada no projeto)
      # =========================================================
      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # =========================================================
      # 3️⃣ Restaura dependências
      # =========================================================
      - name: Restaurar dependências
        run: dotnet restore src/BankMore.Auth.sln

      # =========================================================
      # 4️⃣ Compila em modo Release
      # =========================================================
      - name: Compilar projeto
        run: dotnet build src/BankMore.Auth.sln --configuration Release --no-restore

      # =========================================================
      # 5️⃣ Executa testes com cobertura de código
      # =========================================================
      - name: Executar testes com cobertura
        run: dotnet test src/BankMore.Auth.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

      # =========================================================
      # 6️⃣ Gera relatório HTML da cobertura
      # =========================================================
      - name: Gerar relatório de cobertura
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:**/coverage.cobertura.xml" \
            "-targetdir:TestResults/CoverageReport" \
            -reporttypes:Html

      # =========================================================
      # 7️⃣ Publica artefatos de teste e cobertura
      # =========================================================
      - name: Publicar resultados de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-html
          path: TestResults/CoverageReport

      # =========================================================
      # 8️⃣ Verifica qualidade de código (simples)
      # =========================================================
      - name: Verificação de formato e análise
        run: |
          dotnet format --verify-no-changes || echo "⚠️ Código precisa ser formatado"
          dotnet build --no-restore /warnaserror || echo "⚠️ Corrija avisos antes do merge"
